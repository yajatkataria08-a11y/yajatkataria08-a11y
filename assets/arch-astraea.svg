<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560">
<defs>
  <linearGradient id="archbg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#07101E"/>
    <stop offset="100%" stop-color="#040812"/>
  </linearGradient>
  <linearGradient id="col1grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2D1B69" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#070F1C" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="col2grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0E3A5C" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#070F1C" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="col3grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#064E3B" stop-opacity=".4"/>
    <stop offset="100%" stop-color="#070F1C" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="col4grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#422006" stop-opacity=".4"/>
    <stop offset="100%" stop-color="#070F1C" stop-opacity=".3"/>
  </linearGradient>
  <style>
    @keyframes nodePulse { 0%,100%{r:14;opacity:.8} 50%{r:17;opacity:1} }
    @keyframes flowDash { from{stroke-dashoffset:60} to{stroke-dashoffset:0} }
    @keyframes borderP { 0%,100%{opacity:.3} 50%{opacity:.7} }
    @keyframes cardIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes packetMove { 0%{opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{opacity:0} }
    @keyframes colHeader { 0%,100%{opacity:.7} 50%{opacity:1} }
  </style>
</defs>

<!-- BG -->
<rect width="1200" height="560" fill="url(#archbg)"/>
