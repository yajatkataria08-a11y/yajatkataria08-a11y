<text x="24" y="30" font-size="11" fill="#22d3ee" text-anchor="start" font-weight="700" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" >GEOSEG  ·  PSISR VS BASELINES</text><text x="24" y="62" font-size="13" fill="#f8fafc" text-anchor="start" font-weight="700" >Parameters (M)  ·  lower is better</text><text x="24" y="115" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="normal" >PSISR (ours)</text><rect x="128" y="98" width="260" height="24" rx="6" fill="#ffffff" fill-opacity="0.04"/><rect x="128" y="98" width="0" height="24" rx="6" fill="#34d399"><animate attributeName="width" values="0;136.5;136.5" keyTimes="0;0.2;1" dur="7s" repeatCount="indefinite"/></rect><text x="138" y="115" font-size="12" fill="#0b1020" text-anchor="start" font-weight="800" >8.4 M</text><text x="24" y="157" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="normal" >Swin2-MoSE</text><rect x="128" y="140" width="260" height="24" rx="6" fill="#ffffff" fill-opacity="0.04"/><rect x="128" y="140" width="0" height="24" rx="6" fill="#64748b"><animate attributeName="width" values="0;208.0;208.0" keyTimes="0;0.2;1" dur="7s" repeatCount="indefinite"/></rect><text x="138" y="157" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="800" >12.8 M</text><text x="24" y="199" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="normal" >RCAN</text><rect x="128" y="182" width="260" height="24" rx="6" fill="#ffffff" fill-opacity="0.04"/><rect x="128" y="182" width="0" height="24" rx="6" fill="#64748b"><animate attributeName="width" values="0;253.5;253.5" keyTimes="0;0.2;1" dur="7s" repeatCount="indefinite"/></rect><text x="138" y="199" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="800" >15.6 M</text><text x="468" y="62" font-size="13" fill="#f8fafc" text-anchor="start" font-weight="700" >PSNR @ 8× (dB)  ·  higher is better</text><text x="468" y="80" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="normal" >axis starts at 25.0 dB</text><text x="468" y="115" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="normal" >PSISR (ours)</text><rect x="572" y="98" width="260" height="24" rx="6" fill="#ffffff" fill-opacity="0.04"/><rect x="572" y="98" width="0" height="24" rx="6" fill="#34d399"><animate attributeName="width" values="0;205.4;205.4" keyTimes="0;0.2;1" dur="7s" repeatCount="indefinite"/></rect><text x="582" y="115" font-size="12" fill="#0b1020" text-anchor="start" font-weight="800" ></text><text x="468" y="157" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="normal" >Swin2-MoSE</text><rect x="572" y="140" width="260" height="24" rx="6" fill="#ffffff" fill-opacity="0.04"/><rect x="572" y="140" width="0" height="24" rx="6" fill="#64748b"><animate attributeName="width" values="0;136.5;136.5" keyTimes="0;0.2;1" dur="7s" repeatCount="indefinite"/></rect><text x="582" y="157" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="800" ></text><text x="468" y="199" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="normal" >RCAN</text><rect x="572" y="182" width="260" height="24" rx="6" fill="#ffffff" fill-opacity="0.04"/><rect x="572" y="182" width="0" height="24" rx="6" fill="#64748b"><animate attributeName="width" values="0;104.0;104.0" keyTimes="0;0.2;1" dur="7s" repeatCount="indefinite"/></rect><text x="582" y="199" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="800" ></text><text x="582" y="115" font-size="12" fill="#0b1020" text-anchor="start" font-weight="800" >26.58 dB</text><text x="582" y="157" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="800" >26.05 dB</text><text x="582" y="199" font-size="12" fill="#f8fafc" text-anchor="start" font-weight="800" >25.80 dB</text><text x="24" y="238" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="normal" >Figures as reported in the GEOSEG README (cites Sharma et al., 2025). 34% fewer params than Swin2-MoSE, 46% fewer than RCAN.</text